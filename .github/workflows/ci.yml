name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mew
          POSTGRES_PASSWORD: mew_dev_password
          POSTGRES_DB: mew_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mew"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mew:mew_dev_password@localhost:5432/mew_test?schema=public
      TEST_DATABASE_URL: postgresql://mew:mew_dev_password@localhost:5432/mew_test?schema=public
      # The desktop build only needs Electron's types, not the ~100MB binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace @mew/api

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
