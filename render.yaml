# Render Blueprint — deploys the database, API, and web app together.
# In Render: New → Blueprint → connect this repo. Then fill the `sync: false`
# secrets (see DEPLOY.md). Free tiers are fine to start.

databases:
  - name: mew-db
    databaseName: mew
    user: mew
    plan: free

services:
  # --- Backend API (Docker) ---
  - type: web
    name: mew-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mew-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      # Set these after the first deploy (you'll know the URLs by then):
      - key: PUBLIC_API_URL
        sync: false # → this service's URL, e.g. https://mew-api.onrender.com
      - key: APP_BASE_URL
        sync: false # → the web URL, e.g. https://mew-web.onrender.com
      # Optional provider keys — features run in simulation mode until set:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # --- Web dashboard (Next.js) ---
  - type: web
    name: mew-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace @mew/web
    startCommand: npm run start --workspace @mew/web
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        sync: false # → the mew-api URL from above
